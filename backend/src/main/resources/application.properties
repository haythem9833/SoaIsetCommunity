spring.application.name=demo

# --- Base de données MySQL (créée automatiquement si elle n'existe pas) ---
spring.datasource.url=jdbc:mysql://localhost:3306/iset-community?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# --- JWT : secret en Base64 (>= 256 bits). En production : variable d'environnement JWT_SECRET ---
jwt.secret=${JWT_SECRET:xdQ4fLysHRLkay5f77WARyL1J9ZNuObSu0/TV5+fdSsjX9v6ePCbZXlAQ55rE1kg}
jwt.expiration=86400000

# --- Upload de fichiers (le message d'erreur annonce 20 Mo) ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.upload-dir=uploads

# --- Règles métier ---
app.email-domain=@iset.rnu.tn
server.port=8081
# --- Compte administrateur créé au premier démarrage (à changer !) ---
app.admin.email=${ADMIN_EMAIL:admin@iset.tn}
app.admin.password=${ADMIN_PASSWORD:123}

# --- CORS (frontend en local) ---
app.cors.allowed-origin-patterns=http://localhost:*
